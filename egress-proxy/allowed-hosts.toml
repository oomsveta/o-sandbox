# Hosts the dev container may reach through the egress proxy.
# Changes apply on the next request; no restart needed. Anything not listed
# here gets a 403 (see /etc/egress-proxy/egress.log in the dev container).
#
# Each rule:
#   host     "example.com" matches that host only; ".example.com" matches it
#            and all of its subdomains. Only HTTPS on port 443.
#   methods  list of HTTP methods, or "*" for any method.
#   path     optional path prefix; the rule only applies to paths under it.
#
# Git traffic to github.com is not governed by this file: see GIT_FETCH and
# GIT_PUSH in policy.py.

allow = [
    # Claude Code: API, login, claude.ai connectors
    { host = ".anthropic.com", methods = "*" },
    { host = ".claude.ai", methods = "*" },
    { host = ".claude.com", methods = "*" },

    # Python packages (read-only: no uploads)
    { host = "pypi.org", methods = ["GET", "HEAD"] },
    { host = "files.pythonhosted.org", methods = ["GET", "HEAD"] },

    # npm packages (read-only: no `npm publish`)
    { host = "registry.npmjs.org", methods = ["GET", "HEAD"] },

    # VS Code server and extensions
    { host = "update.code.visualstudio.com", methods = ["GET", "HEAD"] },
    { host = "vscode.download.prss.microsoft.com", methods = ["GET", "HEAD"] },
    { host = "main.vscode-cdn.net", methods = ["GET", "HEAD"] },
    { host = "marketplace.visualstudio.com", methods = ["GET", "HEAD"] },
    { host = "marketplace.visualstudio.com", methods = ["POST"], path = "/_apis/public/gallery/extensionquery" },
    { host = ".gallery.vsassets.io", methods = ["GET", "HEAD"] },
    { host = ".gallerycdn.vsassets.io", methods = ["GET", "HEAD"] },

    # GitHub: read-only browsing, never authenticated
    { host = "github.com", methods = ["GET", "HEAD"] },
    { host = "raw.githubusercontent.com", methods = ["GET", "HEAD"] },
]
