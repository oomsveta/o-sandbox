services:
  odoo:
    build:
      context: .
    hostname: o-sandbox
    # PID 1 runs as root only to trust the HTTPS proxy's CA, then idles.
    # VS Code attaches as `dev` (remoteUser).
    command:
      - sh
      - -c
      - >-
        install -m 644 /etc/https-proxy/ca.crt /usr/local/share/ca-certificates/https-proxy.crt
        && update-ca-certificates >/dev/null
        && exec sleep infinity
    environment:
      PGHOST: db
      PGUSER: odoo
      PGPASSWORD: odoo
      # The HTTPS proxy is the only route out (the `internal` network has none).
      HTTP_PROXY: http://https-proxy:8080
      HTTPS_PROXY: http://https-proxy:8080
      http_proxy: http://https-proxy:8080
      https_proxy: http://https-proxy:8080
      NO_PROXY: localhost,127.0.0.1,::1,db
      no_proxy: localhost,127.0.0.1,::1,db
      # Clients that don't use the system CA store.
      NODE_EXTRA_CA_CERTS: /etc/https-proxy/ca.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      PIP_CERT: /etc/ssl/certs/ca-certificates.crt
      # Claude Code can't update itself: it's installed in a root-owned folder.
      DISABLE_AUTOUPDATER: "1"
    volumes:
      # The only host folder mounted in the dev container, read-only: the
      # project folder, for seed-repos (see "Git repositories" in the README).
      - ..:/host:ro
      # The container's own clones. Never mounted on the host.
      - src:/odoo
      # Docker-managed volumes
      - odoo-filestore:/home/dev/.local/share/Odoo
      - claude-config:/home/dev/.claude
      # Proxy CA certificate and decision log
      - egress-state:/etc/https-proxy:ro
      # Git relay: login key, host key and decision log
      - git-relay-shared:/etc/git-relay:ro
    depends_on:
      db:
        condition: service_started
      https-proxy:
        condition: service_healthy
      git-relay:
        condition: service_healthy
    networks:
      - internal

  https-proxy:
    # TLS-intercepting proxy enforcing egress/policy/policy.toml.
    image: mitmproxy/mitmproxy:12.2.3@sha256:00b77b5d8804c8ad18cb6caefbf9d5849e895e8986c5ce011f4ae30f4385962f
    entrypoint: ["/bin/sh", "/https-proxy/start.sh"]
    volumes:
      - ./egress/https-proxy:/https-proxy:ro
      - ./egress/policy:/policy:ro
      # CA certificate *and private key*: never mounted in the dev container.
      - mitmproxy-conf:/home/mitmproxy/.mitmproxy
      - egress-state:/srv/egress
    healthcheck:
      test: ["CMD", "test", "-s", "/srv/egress/ca.crt"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - internal
      - egress

  git-relay:
    # SSH server for git: checks fetches and pushes against
    # egress/policy/policy.toml and relays them to GitHub with an SSH key that
    # only this container can read.
    build:
      context: ./egress/git-relay
    entrypoint: ["/bin/sh", "/relay/start.sh"]
    volumes:
      - ./egress/git-relay:/relay:ro
      - ./egress/policy:/policy:ro
      # Relay host key and GitHub key: never mounted anywhere else.
      - git-relay-keys:/srv/git-relay-keys
      - git-relay-shared:/srv/git-relay-shared
      # Optional: the host's own GitHub SSH key (passphrase-less), to use
      # instead of the relay's. Set GIT_RELAY_SSH_KEY to its absolute path,
      # e.g. in .devcontainer/.env. Mounted here only.
      - type: bind
        source: ${GIT_RELAY_SSH_KEY:-./egress/git-relay/no-ssh-key}
        target: /run/secrets/github_key
        read_only: true
        bind:
          # A wrong path is an error, rather than an empty folder created
          # at that path on the host.
          create_host_path: false
    healthcheck:
      test: ["CMD", "test", "-s", "/srv/git-relay-shared/known_hosts"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - internal
      - egress

  db:
    # pgvector is needed by AI modules
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - internal

networks:
  # No route to the outside world.
  internal:
    name: odoo-dev-internal
    internal: true
  # Only the HTTPS proxy and the git relay are attached to this one.
  egress:
    name: odoo-dev-egress

volumes:
  src:
  pg-data:
  odoo-filestore:
  claude-config:
  mitmproxy-conf:
  egress-state:
  git-relay-keys:
  git-relay-shared:
